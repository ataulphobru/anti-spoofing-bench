<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector Facial — Simples</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--ink:#e8eaed;--dim:#9aa3b2;--ok:#2ecc71;--bad:#e74c3c;--warn:#f39c12;--accent:#5b8def;}
  *{box-sizing:border-box}
  /* BUG PEGO NA TELA (16/09): 'display:block' em video/#shot vencia o atributo hidden,
     entao a foto capturada aparecia mesmo escondida. Esta regra devolve o hidden. */
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{margin:0 0 2px;font-size:18px}
  header p{margin:0;color:var(--dim);font-size:13px}
  header a{color:var(--accent)}
  .wrap{max-width:640px;margin:0 auto;padding:16px 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .palco{position:relative;border-radius:10px;overflow:hidden}
  video,#shot{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
  /* mesmo estilo KYC do autenticador: oval tracejado branco, fundo escurecido em volta */
  .oval{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:42%;height:66%;
        border:4px dashed #fff;border-radius:50%;pointer-events:none;
        box-shadow:0 0 0 9999px rgba(8,12,22,.62);transition:border-color .2s}
  .oval.ok{border-color:var(--ok)}
  .guia{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:800;font-size:17px;
        color:#fff;text-shadow:0 2px 8px #000,0 0 3px #000;pointer-events:none}
  .contador{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;
        color:#fff;text-shadow:0 3px 12px #000;pointer-events:none}
  video{transform:scaleX(-1)}
  button{font:inherit;color:var(--ink);background:#1f2531;border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  button.big{flex:1;font-size:16px;font-weight:700;background:var(--accent);border-color:var(--accent);color:var(--bg)}
  button.alt{flex:1;font-size:16px;font-weight:700}
  .row{display:flex;gap:10px;margin:12px 0}
  .prompt{font-size:22px;font-weight:800;text-align:center;padding:16px;border-radius:10px;background:#1f2531;margin-top:12px}
  .verdict{font-size:26px;font-weight:800;text-align:center;padding:16px;border-radius:10px;background:#1f2531;margin-top:12px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .verdict small{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-top:6px}
  .muted{color:var(--dim);font-size:13px}
  details{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
  summary{cursor:pointer;color:var(--dim);font-size:13px}
  #diag{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);white-space:pre-wrap;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Detector Facial</h1>
  <p>Duas opções: tirar uma foto e analisar, ou provar que está vivo com um gesto.
     <a href="autenticador.html"><b>🔐 Autenticador</b></a> · <a href="index.html">bancada</a> · <a href="liveness-completo.html">versão completa</a></p>
</header>

<div class="wrap">
  <div class="card">
    <div class="palco">
      <video id="v" autoplay playsinline muted></video>
      <div id="oval" class="oval" hidden></div>
      <div id="guia" class="guia" hidden></div>
      <div id="contador" class="contador" hidden></div>
    </div>
    <img id="shot" hidden alt="foto capturada">
    <canvas id="c" hidden></canvas>
    <div id="cam" class="muted" style="margin-top:8px">câmera desligada</div>

    <div class="row">
      <button id="foto" class="big">📸 Tirar foto e analisar</button>
      <button id="vida" class="alt">▶ Provar que estou vivo</button>
    </div>
    <div class="row">
      <button id="arquivoBtn" class="alt">🖼 Analisar foto do computador</button>
    </div>
    <input id="arquivo" type="file" accept="image/*" hidden>
    <div class="row">
      <button id="parar" style="flex:0 0 auto">Parar câmera</button>
      <button id="voltar" style="flex:0 0 auto" hidden>↩ Voltar para a câmera</button>
    </div>

    <div id="prompt" class="prompt">clique num dos dois botões</div>
    <div id="verdict" class="verdict" role="status" aria-live="polite">—</div>
  </div>

  <details>
    <summary>Detalhes técnicos</summary>
    <div id="diag">—</div>
  </details>
</div>

<script src="mp/face_mesh.js"></script>
<script>
const $=s=>document.querySelector(s);
const perf=()=>performance.now();
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

// ---------- pontos do rosto ----------
const LEYE=[33,160,158,133,153,144], REYE=[362,385,387,263,373,380];
const NOSE=1, LEDGE=234, REDGE=454, MOUTH_L=61, MOUTH_R=291;
function ear1(p){return (dist(p[1],p[5])+dist(p[2],p[4]))/(2*dist(p[0],p[3])||1e-6);}
function ear(lm){return (ear1(LEYE.map(i=>lm[i]))+ear1(REYE.map(i=>lm[i])))/2;}
function larguraRosto(lm){return dist(lm[LEDGE],lm[REDGE])||1e-6;}
function yaw(lm){return dist(lm[NOSE],lm[LEDGE])/(dist(lm[NOSE],lm[REDGE])||1e-6);}
function boca(lm){return dist(lm[MOUTH_L],lm[MOUTH_R])/larguraRosto(lm);}

// ---------- estado ----------
let stream=null, mesh=null, pronto=false, rodando=false, raf=null, geracao=0;
let lm=null, lmAnterior=null, movimento=0, temRosto=false;
let earAtual=0.3, yawAtual=1, bocaAtual=0.4;
let desafio=null, resolverMesh=null;
let enquadrado=false, desdeQuandoOk=0, autoDisparo=false;
// Enquadramento no estilo dos apps de banco: o rosto precisa ocupar uma faixa de tamanho
// e ficar centralizado. Serve para o usuario (guia claro) E para a medida: recorte de
// tamanho parecido em toda captura deixa as notas comparaveis entre si.
const ENQ={ minLarg:0.19, maxLarg:0.52, tolX:0.16, tolY:0.19, estavelMs:1200 };   // calibrado no C920 do Max
function avaliarEnquadramento(pontos){
  if(!pontos) return {ok:false,msg:'posicione o rosto dentro do oval'};
  let x0=1,y0=1,x1=0,y1=0;
  for(const q of pontos){ if(q.x<x0)x0=q.x; if(q.x>x1)x1=q.x; if(q.y<y0)y0=q.y; if(q.y>y1)y1=q.y; }
  const w=x1-x0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  // distancia (frente/tras) com graduacao: o Max pediu que diga QUANTO falta, nao so a direcao
  if(w < ENQ.minLarg*0.62) return {ok:false,msg:'VENHA BEM MAIS PRA FRENTE'};
  if(w < ENQ.minLarg)      return {ok:false,msg:'VENHA UM POUCO PRA FRENTE'};
  if(w > ENQ.maxLarg*1.25) return {ok:false,msg:'VÁ BEM MAIS PRA TRÁS'};
  if(w > ENQ.maxLarg)      return {ok:false,msg:'VÁ UM POUCO PRA TRÁS'};
  // altura nao inverte no espelho, entao da para mandar subir ou descer direto
  if(cy < 0.5-ENQ.tolY)    return {ok:false,msg:'DESÇA UM POUCO O ROSTO'};
  if(cy > 0.5+ENQ.tolY)    return {ok:false,msg:'SUBA UM POUCO O ROSTO'};
  if(Math.abs(cx-0.5)>ENQ.tolX) return {ok:false,msg:'CENTRALIZE o rosto no oval'};
  return {ok:true,msg:'PERFEITO — fique parado'};
}
function mostrarGuia(ligado){
  $('#oval').hidden=!ligado; $('#guia').hidden=!ligado;
  if(!ligado){ $('#contador').hidden=true; $('#oval').classList.remove('ok'); }
}
const diagLinhas=[];
function diag(m){ diagLinhas.unshift(m); if(diagLinhas.length>25) diagLinhas.length=25; $('#diag').textContent=diagLinhas.join(String.fromCharCode(10)); }

function motor(){
  if(typeof FaceMesh==='undefined'){ $('#cam').textContent='MediaPipe não carregou (confira a pasta mp/)'; return; }
  mesh=new FaceMesh({locateFile:f=>'mp/'+f});
  mesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
  mesh.onResults(res=>{
    if(resolverMesh){ const r=resolverMesh; resolverMesh=null; r(res); return; }   // analise de arquivo
    if(!rodando) return;
    const novo = res.multiFaceLandmarks && res.multiFaceLandmarks[0];
    temRosto=!!novo;
    if(!novo){ lm=null; return; }
    lmAnterior=lm; lm=novo;
    earAtual=ear(lm); yawAtual=yaw(lm); bocaAtual=boca(lm);
    if(lmAnterior){
      let s=0; for(let i=0;i<lm.length;i++) s+=dist(lm[i],lmAnterior[i]);
      movimento=(s/lm.length)/larguraRosto(lm);
    }
    atualizarEnquadramento();
    if(desafio) tick();
  });
  pronto=true;
}

async function ligar(){
  if(stream) return true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}, width:{ideal:1280}}});
    $('#v').srcObject=stream; await $('#v').play().catch(()=>{});
    rodando=true; const g=++geracao; bombear(g);
    const t=stream.getVideoTracks()[0];
    $('#cam').textContent='câmera: '+(t.label||'ligada');
    diag('câmera ligada: '+(t.label||'?'));
    return true;
  }catch(e){
    $('#prompt').textContent='não consegui abrir a câmera';
    $('#cam').textContent='erro: '+e.message; diag('erro de câmera: '+e.message);
    return false;
  }
}
async function bombear(g){
  if(!rodando || g!==geracao) return;
  try{ await mesh.send({image:$('#v')}); }catch(e){}
  if(!rodando || g!==geracao) return;
  raf=requestAnimationFrame(()=>bombear(g));
}
function desligar(){
  rodando=false; geracao++; desafio=null;
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; $('#v').srcObject=null; }
  $('#cam').textContent='câmera desligada';
}

function atualizarEnquadramento(){
  if($('#oval').hidden) return;
  const r=avaliarEnquadramento(lm);
  enquadrado=r.ok;
  $('#oval').classList.toggle('ok', r.ok);
  $('#guia').textContent=r.msg;
  if(!r.ok){ desdeQuandoOk=0; $('#contador').hidden=true; return; }
  if(!desdeQuandoOk) desdeQuandoOk=perf();
  const falta=Math.ceil((ENQ.estavelMs-(perf()-desdeQuandoOk))/1000);
  if(autoDisparo && falta>0){ $('#contador').hidden=false; $('#contador').textContent=falta; }
  if(autoDisparo && perf()-desdeQuandoOk>=ENQ.estavelMs){
    autoDisparo=false; $('#contador').hidden=true;
    capturarAgora();
  }
}

function capturarAgora(){
  window.__lmAtual=lm;
  const r=analisarFoto();
  mostrarGuia(false);
  if(r.erro){ veredito(null, r.erro); return; }
  $('#v').hidden=true; $('#shot').hidden=false; $('#voltar').hidden=false;
  const ataque = r.score>0.5;
  veredito(!ataque,
    ataque ? 'a textura do rosto parece de uma reprodução (foto, tela ou impressão)'
           : 'textura compatível com pele real diante da câmera',
    'nitidez '+r.varLap.toFixed(0)+' · variação de cor '+r.varSat.toFixed(4)+' · brilho '+(r.fracBranco*100).toFixed(1)+'% · nota '+r.score.toFixed(2));
  diag('FOTO: nota='+r.score.toFixed(2)+' nitidez='+r.varLap.toFixed(0)+' varSat='+r.varSat.toFixed(4)+' branco='+(r.fracBranco*100).toFixed(1)+'% recorte='+r.w+'x'+r.h);
}

// =======================================================================
//  OPÇÃO 1 — TIRAR FOTO E ANALISAR
//  Analisa a TEXTURA dentro do rosto. Foto de foto, print ou tela tende a
//  perder micro-textura da pele e ganhar brilho achatado na recaptura.
//  É uma heurística, não um modelo treinado: serve para demonstrar o
//  princípio e para comparar contra o SEU detector depois.
// =======================================================================
function analisarFoto(fonte, pontos){
  const v=fonte||$('#v'), c=$('#c');
  c.width=v.videoWidth||v.naturalWidth||640; c.height=v.videoHeight||v.naturalHeight||480;
  const ctx=c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(v,0,0,c.width,c.height);

  const lm = pontos || window.__lmAtual;
  if(!lm){ return {erro:'não achei um rosto na imagem'}; }

  // recorte do ROSTO pelos pontos do MediaPipe (melhor que recorte fixo no centro)
  let x0=1,y0=1,x1=0,y1=0;
  for(const p of lm){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  const px=Math.max(0,Math.round(x0*c.width)), py=Math.max(0,Math.round(y0*c.height));
  const pw=Math.min(c.width-px, Math.round((x1-x0)*c.width));
  const ph=Math.min(c.height-py, Math.round((y1-y0)*c.height));
  if(pw<40||ph<40){ return {erro:'rosto pequeno demais — chegue mais perto'}; }

  const d=ctx.getImageData(px,py,pw,ph).data;
  const cinza=new Float32Array(pw*ph); const sat=new Float32Array(pw*ph);
  let brancos=0;
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const r=d[i],g=d[i+1],b=d[i+2];
    cinza[p]=0.299*r+0.587*g+0.114*b;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    sat[p]= mx>0 ? (mx-mn)/mx : 0;
    if(r>250&&g>250&&b>250) brancos++;
  }
  // nitidez: variância do Laplaciano
  let soma=0,n=0; const vals=[];
  for(let y=1;y<ph-1;y++)for(let x=1;x<pw-1;x++){
    const i=y*pw+x;
    const L=4*cinza[i]-cinza[i-1]-cinza[i+1]-cinza[i-pw]-cinza[i+pw];
    vals.push(L); soma+=L; n++;
  }
  const media=soma/n; let varLap=0; for(const q of vals) varLap+=(q-media)*(q-media); varLap/=n;
  // variação de saturação da pele
  let sm=0; for(let i=0;i<sat.length;i++) sm+=sat[i]; sm/=sat.length;
  let varSat=0; for(let i=0;i<sat.length;i++) varSat+=(sat[i]-sm)*(sat[i]-sm); varSat/=sat.length;
  const fracBranco=brancos/(pw*ph);

  // pontuação: 0 = parece genuíno, 1 = parece ataque. Limiares de demonstração.
  const sNitidez = Math.max(0, Math.min(1, 1 - varLap/150));
  const sSat     = Math.max(0, Math.min(1, 1 - varSat*45));
  const sBrilho  = Math.max(0, Math.min(1, fracBranco*8));
  const score = 0.5*sNitidez + 0.3*sSat + 0.2*sBrilho;

  c.toBlob(b=>{ const u=URL.createObjectURL(b); const img=$('#shot');
    img.onload=()=>URL.revokeObjectURL(u); img.src=u; }, 'image/jpeg', 0.9);

  return {score, varLap, varSat, fracBranco, sNitidez, sSat, sBrilho, w:pw, h:ph};
}

$('#foto').onclick=async()=>{
  if(!pronto){ $('#prompt').textContent='o motor de rosto ainda não carregou'; return; }
  if(!await ligar()) return;
  $('#shot').hidden=true; $('#v').hidden=false; $('#voltar').hidden=true;
  $('#verdict').className='verdict'; $('#verdict').textContent='—';
  $('#prompt').textContent='encaixe o rosto no oval e olhe para a câmera';
  desdeQuandoOk=0; autoDisparo=true; mostrarGuia(true);
  diag('enquadramento ligado — captura automatica quando estabilizar');
};

$('#arquivoBtn').onclick=()=>{ if(!pronto){ $('#prompt').textContent='o motor de rosto ainda não carregou'; return; } $('#arquivo').click(); };
$('#arquivo').onchange=async(e)=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  e.target.value='';
  $('#arquivoBtn').disabled=true;
  const url=URL.createObjectURL(f);
  try{
    $('#prompt').textContent='analisando a foto…';
    const img=new Image();
    await new Promise((ok,err)=>{ img.onload=ok; img.onerror=()=>err(new Error('não consegui abrir essa imagem')); img.src=url; });
    // roda o detector de rosto na imagem parada
    const res=await new Promise((ok)=>{ resolverMesh=ok; mesh.send({image:img}).catch(()=>{ resolverMesh=null; ok(null); }); });
    const pontos = res && res.multiFaceLandmarks && res.multiFaceLandmarks[0];
    if(!pontos){ veredito(null,'não achei um rosto nessa foto — tente uma em que o rosto apareça maior'); return; }
    const r=analisarFoto(img, pontos);
    if(r.erro){ veredito(null,r.erro); return; }
    $('#v').hidden=true; $('#shot').hidden=false; $('#voltar').hidden=false;
    const ataque = r.score>0.5;
    veredito(!ataque,
      ataque ? 'a textura parece de uma reprodução (foto de foto, tela ou impressão)'
             : 'textura compatível com pele real — atenção: foto de boa qualidade engana este teste',
      'arquivo: '+f.name+' · nitidez '+r.varLap.toFixed(0)+' · variação de cor '+r.varSat.toFixed(4)+' · brilho '+(r.fracBranco*100).toFixed(1)+'% · nota '+r.score.toFixed(2));
    diag('ARQUIVO '+f.name+': nota='+r.score.toFixed(2)+' nitidez='+r.varLap.toFixed(0)+' varSat='+r.varSat.toFixed(4)+' branco='+(r.fracBranco*100).toFixed(1)+'%');
  }catch(err){
    veredito(null, err.message||'falha ao analisar a imagem'); diag('erro no arquivo: '+(err.message||err));
  }finally{
    URL.revokeObjectURL(url); $('#arquivoBtn').disabled=false;
  }
};

$('#voltar').onclick=()=>{
  mostrarGuia(false); autoDisparo=false;
  $('#shot').hidden=true; $('#v').hidden=false; $('#voltar').hidden=true;
  $('#prompt').textContent='clique num dos dois botões'; $('#verdict').className='verdict'; $('#verdict').textContent='—';
};

// =======================================================================
//  OPÇÃO 2 — PROVAR QUE ESTÁ VIVO (um gesto só, sorteado)
//  Uma foto parada não consegue cumprir um gesto pedido na hora.
// =======================================================================
const GESTOS=[
  {k:'piscar',  texto:()=>{const n=2;return {rotulo:'PISQUE '+n+' VEZES', n};}},
  {k:'esquerda',texto:()=>({rotulo:'VIRE A CABEÇA PARA A ESQUERDA'})},
  {k:'direita', texto:()=>({rotulo:'VIRE A CABEÇA PARA A DIREITA'})},
  {k:'sorrir',  texto:()=>({rotulo:'SORRIA'})},
];
const TEMPO_MS=25000;
let piscadas=0, olhoFechado=false, limiarBaixo=0.19, limiarAlto=0.25;

$('#vida').onclick=async()=>{
  $('#vida').disabled=true;
  try{
    if(!pronto){ $('#prompt').textContent='o motor de rosto ainda não carregou'; return; }
    if(!await ligar()) return;
    $('#shot').hidden=true; $('#v').hidden=false; $('#voltar').hidden=true;
    $('#verdict').className='verdict'; $('#verdict').textContent='—';
    $('#prompt').textContent='encaixe o rosto no oval';
    autoDisparo=false; desdeQuandoOk=0; mostrarGuia(true);

    // espera ficar bem enquadrado (ate 15s) antes de sortear o gesto
    const limEnq=perf()+15000;
    while(perf()<limEnq){ if(enquadrado && perf()-desdeQuandoOk>600) break; await new Promise(r=>setTimeout(r,80)); }
    mostrarGuia(false);

    const limite=perf()+6000;
    while(!lm && perf()<limite){ await new Promise(r=>setTimeout(r,100)); }
    if(!lm){ veredito(null,'não consegui ver seu rosto — confira a luz e a câmera'); return; }

    // calibra a piscada no seu olho, com 1 segundo de amostra
    const amostras=[]; const fim=perf()+1000;
    while(perf()<fim){ if(lm) amostras.push(earAtual); await new Promise(r=>setTimeout(r,33)); }
    if(amostras.length>=8){
      amostras.sort((a,b)=>a-b);
      const aberto=amostras[Math.floor(amostras.length/2)];
      limiarBaixo=Math.max(0.10, aberto*0.62); limiarAlto=Math.max(limiarBaixo+0.03, aberto*0.80);
      diag('olho calibrado: aberto='+aberto.toFixed(3)+' fecha<'+limiarBaixo.toFixed(3)+' abre>'+limiarAlto.toFixed(3));
    }

    const g=GESTOS[rnd(GESTOS.length)]; const info=g.texto();
    piscadas=0; olhoFechado=false;
    desafio={k:g.k, n:info.n||0, baseYaw:yawAtual||1, baseBoca:bocaAtual||0.4, prazo:perf()+TEMPO_MS, inicio:perf()};
    $('#prompt').textContent=info.rotulo;
    diag('gesto sorteado: '+g.k+' (você tem '+(TEMPO_MS/1000)+'s)');
  } finally { $('#vida').disabled=false; }
};

function tick(){
  if(!desafio) return;
  // conta piscadas continuamente
  if(earAtual<limiarBaixo && !olhoFechado) olhoFechado=true;
  else if(earAtual>limiarAlto && olhoFechado){ olhoFechado=false; piscadas++; diag('piscada '+piscadas); }

  let feito=false;
  if(desafio.k==='piscar')   feito = piscadas>=desafio.n;
  if(desafio.k==='esquerda') feito = (yawAtual/desafio.baseYaw)>1.30;
  if(desafio.k==='direita')  feito = (yawAtual/desafio.baseYaw)<0.77;
  if(desafio.k==='sorrir')   feito = (bocaAtual/desafio.baseBoca)>1.12;

  if(feito){
    const d=desafio; desafio=null;
    veredito(true,'você fez o gesto que foi pedido na hora — uma foto parada não faz isso',
      'gesto: '+d.k+' · levou '+((perf()-d.inicio)/1000).toFixed(1)+'s');
    diag('PASSOU no gesto '+d.k);
    return;
  }
  if(perf()>desafio.prazo){
    const d=desafio; desafio=null;
    veredito(false,'o gesto pedido não foi feito no tempo',
      'gesto: '+d.k+' · piscadas contadas: '+piscadas+' · giro: '+(yawAtual/d.baseYaw).toFixed(2)+' · boca: '+(bocaAtual/d.baseBoca).toFixed(2));
    diag('REPROVOU: tempo esgotado no gesto '+d.k+' (piscadas='+piscadas+')');
  }
}

function veredito(ok, texto, extra){
  const el=$('#verdict');
  if(ok===null){ el.className='verdict'; el.innerHTML='—<small>'+texto+'</small>'; $('#prompt').textContent=texto; return; }
  el.className='verdict '+(ok?'ok':'bad');
  el.innerHTML=(ok?'✔ PARECE GENUÍNO':'✖ PARECE ATAQUE')+'<small>'+texto+(extra?'<br>'+extra:'')+'</small>';
  $('#prompt').textContent='clique num dos dois botões para testar de novo';
}

$('#parar').onclick=()=>{ mostrarGuia(false); autoDisparo=false; desligar(); $('#prompt').textContent='câmera desligada'; };

if(document.readyState!=='loading') motor(); else addEventListener('DOMContentLoaded', motor);
</script>
